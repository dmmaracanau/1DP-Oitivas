<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2c1654"/>
      <stop offset="60%" stop-color="#150a2b"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Clock Face Inner Glow -->
    <radialGradient id="faceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f113d"/>
      <stop offset="85%" stop-color="#120924"/>
      <stop offset="100%" stop-color="#0a0515"/>
    </radialGradient>

    <!-- Hands Glowing Gradient -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Hand Gradient -->
    <linearGradient id="secHandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shadow & Base Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- Outer Vibrant Purple Bezel Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ringGrad)" stroke-width="26" filter="url(#purpleGlow)" opacity="0.95"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ringGrad)" stroke-width="20"/>

  <!-- Inner Dark Purple Clock Face -->
  <circle cx="256" cy="256" r="204" fill="url(#faceGrad)" stroke="#3b1d6e" stroke-width="4"/>

  <!-- 12 Hour Dial Markers -->
  <!-- 12 o'clock (Top) -->
  <rect x="247" y="68" width="18" height="34" rx="9" fill="#f3e8ff"/>
  <!-- 3 o'clock (Right) -->
  <rect x="410" y="247" width="34" height="18" rx="9" fill="#d8b4fe"/>
  <!-- 6 o'clock (Bottom) -->
  <rect x="247" y="410" width="18" height="34" rx="9" fill="#d8b4fe"/>
  <!-- 9 o'clock (Left) -->
  <rect x="68" y="247" width="34" height="18" rx="9" fill="#d8b4fe"/>

  <!-- Minor Hour Dots (1, 2, 4, 5, 7, 8, 10, 11) -->
  <circle cx="348" cy="98" r="9" fill="#a855f7" opacity="0.85"/>
  <circle cx="414" cy="164" r="9" fill="#a855f7" opacity="0.85"/>
  <circle cx="414" cy="348" r="9" fill="#a855f7" opacity="0.85"/>
  <circle cx="348" cy="414" r="9" fill="#a855f7" opacity="0.85"/>
  <circle cx="164" cy="414" r="9" fill="#a855f7" opacity="0.85"/>
  <circle cx="98" cy="348" r="9" fill="#a855f7" opacity="0.85"/>
  <circle cx="98" cy="164" r="9" fill="#a855f7" opacity="0.85"/>
  <circle cx="164" cy="98" r="9" fill="#a855f7" opacity="0.85"/>

  <!-- Inner Accent Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6b21a8" stroke-dasharray="8 12" stroke-width="3" opacity="0.4"/>

  <!-- Clock Hands (Pointing at 10:10 / scheduled hearing icon) -->
  <!-- Hour Hand (pointing towards 10 o'clock) -->
  <line x1="256" y1="256" x2="165" y2="155" stroke="url(#handGrad)" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Minute Hand (pointing towards 2 o'clock) -->
  <line x1="256" y1="256" x2="365" y2="130" stroke="url(#handGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- Second Hand / Accent Indicator (pointing towards 6 o'clock) -->
  <line x1="256" y1="280" x2="256" y2="390" stroke="#c084fc" stroke-width="6" stroke-linecap="round"/>

  <!-- Center Pivot Pin with Glow -->
  <circle cx="256" cy="256" r="22" fill="#2e1065" stroke="#a855f7" stroke-width="4"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
  <circle cx="256" cy="256" r="5" fill="#9333ea"/>
</svg>
